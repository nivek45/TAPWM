<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>

    <p id="p1"></p>
    <p id="p2"></p>
    <p id="p3"></p>
    <p id="p4"></p>
    <p id="p5"></p>

    <script>

        let pessoa = {
            nome: "João",
            idade: 30,
            hobby: "Tocar violão",

            r: function() {
                return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}.`;
            }
        };



        let pessoa2 = new Object();

        pessoa2.nome = "Maria";
        pessoa2.idade = 25;
        pessoa2.hobby = "Cozinhar";

        pessoa2.r = function() {
            return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}.`;
        };



        function CriarPessoa(nome, idade, hobby) {

            this.nome = nome;
            this.idade = idade;
            this.hobby = hobby;

            this.r = function() {
                return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}.`;
            };

        }

        let pessoa3 = new CriarPessoa(
            "Wilian",
            28,
            "Futebol"
        );



        class Pessoa {

            constructor(nome, idade, hobby) {
                this.nome = nome;
                this.idade = idade;
                this.hobby = hobby;
            }

            r() {
                return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}.`;
            }

        }

        let pessoa4 = new Pessoa(
            "Jubiscreuda",
            67,
            "Croche"
        );



        let modelo = {

            r: function() {
                return `Olá, meu nome é ${this.nome}, tenho ${this.idade} anos e meu hobby é ${this.hobby}.`;
            }

        };

        let pessoa5 = Object.create(modelo);

        pessoa5.nome = "Carlos";
        pessoa5.idade = 40;
        pessoa5.hobby = "Leitura";



        document.getElementById("p1").innerText =
            pessoa.r();

        document.getElementById("p2").innerText =
            pessoa2.r();

        document.getElementById("p3").innerText =
            pessoa3.r();

        document.getElementById("p4").innerText =
            pessoa4.r();

        document.getElementById("p5").innerText =
            pessoa5.r();

    </script>

</body>
</html>
