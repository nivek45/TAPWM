<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2 - Atividade 15</title>
</head>
<body bgcolor="#ffffff">

    <div style="background-color: #00a2e8; color: white; width: 450px; padding: 20px; font-family: Arial, sans-serif;">
        <h3 align="center" style="margin-top: 0; color: white;">Cursos Fatec Sorocaba</h3>

        <label for="cursos"><b>Selecione um curso:</b></label><br><br>
        
        <select id="cursos" name="cursos" onchange="abrirCurso(this)" style="width: 100%; padding: 5px;">
            <option value="">-- Escolha um curso --</option>
            <option value="ads">Análise e Desenvolvimento de Sistemas</option>
            <option value="ea">Eletrônica Automotiva</option>
            <option value="fm">Fabricação Mecânica</option>
            <option value="log">Logística</option>
            <option value="sb">Sistemas Biomédicos</option>
        </select>
    </div>

    <script>
        function abrirCurso(select) {
            var valor = select.value;
            if (valor === "") return;

            var nomeCurso = select.options[select.selectedIndex].text;

            if (confirm("Deseja realmente abrir a janela com informações do curso: " + nomeCurso + "?")) {
                var janela = window.open("", "_blank", "width=600,height=300");
                
                var conteudo = "";
                if (valor === "ads") {
                    conteudo = "<h2>Análise e Desenvolvimento de Sistemas</h2><p>Curso voltado para desenvolvimento de software, banco de dados, redes e engenharia de software.</p>";
                } else if (valor === "ea") {
                    conteudo = "<h2>Eletrônica Automotiva</h2><p>Capacita profissionais para atuar nos sistemas eletrônicos e computacionais dos veículos modernos.</p>";
                } else if (valor === "fm") {
                    conteudo = "<h2>Fabricação Mecânica</h2><p>Foco nos processos industriais de usinagem, conformação e planejamento de produção mecânica.</p>";
                } else if (valor === "log") {
                    conteudo = "<h2>Logística</h2><p>Foco na gestão de transporte, armazenagem, suprimentos e cadeia de suprimentos.</p>";
                } else if (valor === "sb") {
                    conteudo = "<h2>Sistemas Biomédicos</h2><p>Forma especialistas em instalação, manutenção e gestão de equipamentos médico-hospitalares.</p>";
                }

                janela.document.write("<!DOCTYPE html><html><head><title>" + nomeCurso + "</title></head><body style='font-family: Arial, sans-serif; padding: 20px; background-color: #e6f2ff;'>" + conteudo + "</body></html>");
            }
        }
    </script>

</body>
</html>
